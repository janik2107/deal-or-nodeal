<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deal or NoDeal"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.json">
<title>Deal or NoDeal</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main id="view"></main>
<div id="actions" hidden>
 <button class="rb no" data-act="no" aria-label="NoDeal">✕</button>
 <button class="rb undo" data-act="undo" aria-label="Rückgängig">↶</button>
 <button class="rb yes" data-act="yes" aria-label="Deal">♥</button>
</div>
<nav class="tabbar" id="tabbar">
 <button data-tab="swipe"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9.5 10.5l5 5M14.5 10.5l-5 5" opacity="0"/></svg>Swipen</button>
 <button data-tab="deals"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.7 8 3.7 4.5 7.2 4.5c2 0 3.6 1.2 4.8 2.9 1.2-1.7 2.8-2.9 4.8-2.9 3.5 0 5.5 3.5 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>Deals<span class="tb-badge" id="dealcount"></span></button>
 <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mehr</button>
</nav>
<div id="toast" hidden></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body></html>
